<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket de Parque de Diversão</title>
    <link rel="stylesheet" href="style/ticket.css">
</head>
<body>
    <h1> Cadastro de Ticket Parque de Diversão</h1>
    <br><br>

    
    <form method="get" action="salvar-clientes.php">
        <fieldset>
            <legend>Cadastro do Responsável</legend>
        <div> 
            <label for="campo-nome">Nome</label>
            <input type="text" id="campo-nome" name="nome" minlength="3" maxlength="50" required>
        </div>
        <br><br>

        <div>
            <label for="campo-cpf">CPF:</label>
            <input type="text" id="campo-cpf" name="cpf" placeholder="000.000.000-00" pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}" minlength="14" maxlength="14" title="Digite o CPF no formato 000.000.000-00" required>
        </div>
        <br><br>

        <div> 
            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000">
        </div>
        <br><br>

        <div>
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
        </div>
        <br><br>

        <div>
        <label for="nascimento">Data de nascimento:</label>
        <input type="date" id="nascimento" name="nascimento">
        </div>
        <br><br>


        <legend>Cadastro da Criança</legend>
      
        <div> 
            <label for="campo-nome">Nome</label>
            <input type="text" id="campo-nome" name="nome" minlength="3" maxlength="50" required>
        </div>
        <br><br>

        <div>
            <label for="campo-cpf">CPF:</label>
            <input type="text" id="campo-cpf" name="cpf" placeholder="000.000.000-00" pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}" minlength="14" maxlength="14" title="Digite o CPF no formato 000.000.000-00" required>
        </div>
        <br><br>

        <div>
        <label for="nascimento">Data de nascimento:</label>
        <input type="date" id="nascimento" name="nascimento">
        </div>
        <br><br>
    

        <legend>Forma de Pagamento</legend>
        <br><br>
        <legend>Cartão de Crédito</legend>

        <div>
        <label for="titular">Nome do titular:</label>
        <input type="text" id="titular" name="titular" placeholder="Nome no cartão" autocomplete="cc-name"
        required>
        </div>
        <br><br>

        <div>
        <label for="numero">Número do cartão:</label>
        <input type="text" id="numero" name="numero" placeholder="1234 5678 9012 3456" pattern="[0-9]{4} [0-9]{4} [0-9]{4} [0-9]{4}"
    maxlength="19" title="Digite 4 grupos de 4 números separados por espaços" required>
        </div>
        <br><br>

        <div>
        <label for="mes">Mês de validade:</label>
      <input type="text" id="mes" name="mes" placeholder="MM" pattern="0[1-9]|1[0-2]" maxlength="2"
       inputmode="numeric" title="Digite um mês entre 01 e 12" required>
        </div>
        <br><br>

        <div>
       <label for="ano">Ano de validade:</label>
       <input type="text" id="ano" name="ano" placeholder="AA" pattern="[0-9]{2}"
       maxlength="2" inputmode="numeric" title="Digite o ano com dois números, por exemplo 28" required>
        </div>
        <br><br>

         <div>
        <label for="cvc">CVC:</label>
        <input type="text" id="cvc" name="cvc" placeholder="123" pattern="[0-9]{3}" maxlength="3"
        inputmode="numeric" required>
        <br><br>

        <div>
        <h3>Valor do ticket</h3>
        <p>R$ 103,97</p>
        </div>
        <br><br>

        <div>
            <button type="submit">Salvar</button>
        </div>
</fieldset>
</form> 

</body>
</html>
